name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create or publish, for example v0.1.0"
        required: true
        type: string
      release_title:
        description: "Optional release title. Defaults to Velotype <release_tag>."
        required: false
        type: string
      previous_release_tag:
        description: "Optional changelog start tag. Defaults to the previous published stable version."
        required: false
        type: string
      release_notes:
        description: "Optional Markdown release notes. They are prepended to generated notes."
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-2025
            artifact: velotype-windows-x86_64
            archive_suffix: windows-x86_64.zip
          - name: Windows ARM64
            os: windows-11-arm
            artifact: velotype-windows-aarch64
            archive_suffix: windows-aarch64.zip
          - name: Linux x86_64
            os: ubuntu-22.04
            artifact: velotype-linux-x86_64
            archive_suffix: linux-x86_64.tar.gz
          - name: Linux ARM64
            os: ubuntu-22.04-arm
            artifact: velotype-linux-aarch64
            archive_suffix: linux-aarch64.tar.gz
          - name: macOS x86_64
            os: macos-15-intel
            artifact: velotype-macos-x86_64
            archive_suffix: macos-x86_64.zip
          - name: macOS aarch64
            os: macos-15
            artifact: velotype-macos-aarch64
            archive_suffix: macos-aarch64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        shell: bash
        run: |
          rustup update stable
          rustup default stable

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION="$(cargo metadata --locked --format-version 1 --no-deps | node -e 'const fs = require("fs"); const metadata = JSON.parse(fs.readFileSync(0, "utf8")); process.stdout.write(metadata.packages.find(pkg => pkg.name === "velotype").version);')"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "release_tag must match Cargo.toml package.version"
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake clang libssl-dev \
            libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxcb1-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxdamage-dev libxfixes-dev libxrender-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libvulkan-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Verify native updater
        run: cargo test updater --locked

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item target/release/velotype.exe dist/package/velotype.exe
          Copy-Item README.md dist/package/README.md
          Copy-Item LICENSE-APACHE dist/package/LICENSE-APACHE
          $archive = "velotype-${env:RELEASE_TAG}-${{ matrix.archive_suffix }}"
          Compress-Archive -Path dist/package/* -DestinationPath "dist/$archive" -Force

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p dist/package/share/applications
          mkdir -p dist/package/share/icons/hicolor/256x256/apps
          mkdir -p dist/package/share/icons/hicolor/512x512/apps
          cp target/release/velotype dist/package/velotype
          cp README.md LICENSE-APACHE dist/package/
          cp resources/linux/com.manyougz.Velotype.desktop dist/package/share/applications/
          cp resources/linux/icons/hicolor/256x256/apps/com.manyougz.Velotype.png dist/package/share/icons/hicolor/256x256/apps/
          cp resources/linux/icons/hicolor/512x512/apps/com.manyougz.Velotype.png dist/package/share/icons/hicolor/512x512/apps/
          archive="velotype-${RELEASE_TAG}-${{ matrix.archive_suffix }}"
          tar -C dist/package -czf "dist/$archive" .

      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p "dist/Velotype.app/Contents/MacOS"
          mkdir -p "dist/Velotype.app/Contents/Resources"
          cp target/release/velotype "dist/Velotype.app/Contents/MacOS/velotype"
          cp resources/macos/Info.plist "dist/Velotype.app/Contents/Info.plist"
          VERSION="${RELEASE_TAG#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION%%[-+]*}" "dist/Velotype.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VERSION%%[-+]*}" "dist/Velotype.app/Contents/Info.plist"
          cp resources/macos/velotype.icns "dist/Velotype.app/Contents/Resources/velotype.icns"
          chmod +x "dist/Velotype.app/Contents/MacOS/velotype"
          archive="velotype-${RELEASE_TAG}-${{ matrix.archive_suffix }}"
          ditto -c -k --sequesterRsrc --keepParent "dist/Velotype.app" "dist/$archive"

      - name: Create macOS PKG installer
        if: runner.os == 'macOS' && matrix.name == 'macOS aarch64'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          APP_NAME="Velotype"
          BUNDLE_ID="com.manyougz.Velotype"
          COMPONENT_PKG="${APP_NAME}-component.pkg"

          mkdir -p dist/pkg/root/Applications
          mkdir -p dist/pkg/scripts

          cp -R dist/${APP_NAME}.app dist/pkg/root/Applications/
          cp resources/macos/pkg/postinstall dist/pkg/scripts/
          cp resources/macos/pkg/preuninstall dist/pkg/scripts/
          chmod +x dist/pkg/scripts/*

          # Sign the app bundle with ad-hoc signature
          # This is required for the PKG installer to work properly
          xattr -cr "dist/pkg/root/Applications/${APP_NAME}.app" 2>/dev/null || true
          codesign --force --deep --sign - "dist/pkg/root/Applications/${APP_NAME}.app" || {
            echo "Warning: Code signing failed, continuing anyway..."
          }

          pkgbuild --root dist/pkg/root \
            --scripts dist/pkg/scripts \
            --identifier "$BUNDLE_ID" \
            --version "$VERSION" \
            --install-location "/" \
            dist/pkg/${COMPONENT_PKG}

          cp resources/macos/pkg/Distribution.xml dist/pkg/
          sed -i '' "s/__VELOTYPE_VERSION__/${VERSION}/g" dist/pkg/Distribution.xml

          productbuild --distribution dist/pkg/Distribution.xml \
            --package-path dist/pkg \
            "dist/velotype-${RELEASE_TAG}-macos.pkg"

          pkgutil --expand "dist/velotype-${RELEASE_TAG}-macos.pkg" "dist/pkg/expanded" || true
          if [ -f "dist/pkg/expanded/${COMPONENT_PKG}/PackageInfo" ]; then
            sed -i '' '/<relocate>/,/<\/relocate>/d' "dist/pkg/expanded/${COMPONENT_PKG}/PackageInfo"
            pkgutil --flatten "dist/pkg/expanded" "dist/velotype-${RELEASE_TAG}-macos.pkg"
            rm -rf "dist/pkg/expanded"
          fi

          rm -rf dist/pkg

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/velotype-${{ inputs.release_tag }}-${{ matrix.archive_suffix }}
          if-no-files-found: error

      - name: Upload macOS PKG artifact
        if: runner.os == 'macOS' && matrix.name == 'macOS aarch64'
        uses: actions/upload-artifact@v7
        with:
          name: velotype-macos-pkg
          path: dist/velotype-${{ inputs.release_tag }}-macos.pkg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate and create release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v.+ ]]; then
            echo "release_tag must start with v, for example v0.1.0"
            exit 1
          fi

          git fetch --tags --force origin

          current_commit="$(git rev-parse HEAD)"
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$tag_commit" != "$current_commit" ]]; then
              echo "Tag $RELEASE_TAG already points to $tag_commit, not current commit $current_commit"
              exit 1
            fi
            echo "Tag $RELEASE_TAG already exists and points to the current commit."
          else
            if [[ -z "$RELEASE_TITLE" ]]; then
              RELEASE_TITLE="Velotype $RELEASE_TAG"
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "$RELEASE_TITLE" "$current_commit"
            git push origin "$RELEASE_TAG"
          fi

      - name: Resolve changelog start tag
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PREVIOUS_RELEASE_TAG: ${{ inputs.previous_release_tag }}
        run: |
          set -euo pipefail

          releases_file="$(mktemp)"
          trap 'rm -f "$releases_file"' EXIT
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > "$releases_file"
          previous_tag="$(node - "$RELEASE_TAG" "$releases_file" "$PREVIOUS_RELEASE_TAG" <<'NODE'
          const fs = require("node:fs");

          // Release dates and the GitHub "Latest" flag need not follow version order.
          function parseVersion(tag) {
            const match = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.exec(tag);
            return match && {
              core: match.slice(1, 4).map(BigInt),
              prerelease: match[4] ? match[4].split(".") : [],
            };
          }

          function compareVersions(left, right) {
            for (let index = 0; index < left.core.length; index++) {
              if (left.core[index] < right.core[index]) return -1;
              if (left.core[index] > right.core[index]) return 1;
            }
            if (!left.prerelease.length && right.prerelease.length) return 1;
            if (left.prerelease.length && !right.prerelease.length) return -1;
            for (let index = 0; index < Math.min(left.prerelease.length, right.prerelease.length); index++) {
              const a = left.prerelease[index];
              const b = right.prerelease[index];
              if (a === b) continue;
              const aNumeric = /^\d+$/.test(a);
              const bNumeric = /^\d+$/.test(b);
              if (aNumeric && bNumeric) return BigInt(a) < BigInt(b) ? -1 : 1;
              if (aNumeric !== bNumeric) return aNumeric ? -1 : 1;
              return a < b ? -1 : 1;
            }
            return Math.sign(left.prerelease.length - right.prerelease.length);
          }

          function previousReleaseTag(releases, releaseTag, override = "") {
            const current = parseVersion(releaseTag);
            if (!current) throw new Error(`Invalid release tag: ${releaseTag}`);

            const published = releases.filter(
              (release) => !release.draft && release.published_at,
            );
            if (override) {
              if (override === releaseTag) {
                throw new Error("The changelog start tag must not be the current release.");
              }
              if (!published.some((release) => release.tag_name === override)) {
                throw new Error(`Changelog start tag is not a published release: ${override}`);
              }
              const version = parseVersion(override);
              if (version && compareVersions(version, current) >= 0) {
                throw new Error("The changelog start version must be older than the current release.");
              }
              return override;
            }

            const candidates = published
              .filter((release) => !release.prerelease && release.tag_name !== releaseTag)
              .map((release) => ({
                tag: release.tag_name,
                version: parseVersion(release.tag_name),
              }))
              .filter(({ version }) => version
                && !version.prerelease.length
                && compareVersions(version, current) < 0)
              .sort((left, right) => compareVersions(right.version, left.version));

            if (candidates.length > 0) return candidates[0].tag;
            if (published.some((release) => release.tag_name !== releaseTag)) {
              throw new Error(
                "No previous stable version found. Set previous_release_tag explicitly instead of guessing a changelog range.",
              );
            }
            return "";
          }

          try {
            const [releaseTag, releasesFile, override] = process.argv.slice(2);
            const pages = JSON.parse(fs.readFileSync(releasesFile, "utf8"));
            console.log(previousReleaseTag(pages.flat(), releaseTag, override));
          } catch (error) {
            console.error(error.message);
            process.exitCode = 1;
          }
          NODE
          )"

          if [[ -n "$previous_tag" ]]; then
            git rev-parse --verify "refs/tags/$previous_tag^{commit}" >/dev/null
            echo "Changelog range: $previous_tag...$RELEASE_TAG"
          else
            echo "First release: no previous published release."
          fi
          printf 'previous_tag=%s\n' "$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          PREVIOUS_RELEASE_TAG: ${{ steps.changelog.outputs.previous_tag }}
        run: |
          set -euo pipefail

          if [[ -z "$RELEASE_TITLE" ]]; then
            RELEASE_TITLE="Velotype $RELEASE_TAG"
          fi

          release_args=(
            "$RELEASE_TAG" dist/*
            --repo "$GH_REPO"
            --title "$RELEASE_TITLE"
            --target "$GITHUB_SHA"
            --generate-notes
            --verify-tag
          )
          if [[ -n "$PREVIOUS_RELEASE_TAG" ]]; then
            release_args+=(--notes-start-tag "$PREVIOUS_RELEASE_TAG")
          fi

          if [[ -n "$RELEASE_NOTES" ]]; then
            notes_file="$(mktemp)"
            trap 'rm -f "$notes_file"' EXIT
            printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
            release_args+=(--notes-file "$notes_file")
          fi
          gh release create "${release_args[@]}"
